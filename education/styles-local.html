<style>

.wrapper { max-width: 1100px; }

.edu-intro {
  font-size: 1em;
  color: #7A6E68;
  margin-bottom: 24px;
}

/* ── Filter bars ─────────────────────────────────────────────────────────── */

#edu-filters {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 24px;
}

#edu-access-tabs,
#edu-category-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.edu-tab,
.edu-cat {
  padding: 7px 18px;
  font-size: 14px;
  font-weight: 700;
  font-family: "Fredoka", "Nunito", sans-serif;
  border-radius: 999px;
  border: 2px solid rgba(0,0,0,0.10);
  background: rgba(255,255,255,0.9);
  color: #7A6E68;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
}

.edu-tab:hover,
.edu-cat:hover {
  border-color: rgba(255,140,66,0.4);
  color: #2A2320;
  transform: translateY(-1px);
}

.edu-tab.active {
  background: linear-gradient(135deg, #FF8C42, #ffaa5e);
  color: #fff;
  border-color: transparent;
}

.edu-cat.active {
  background: rgba(255,140,66,0.12);
  color: #d06010;
  border-color: rgba(255,140,66,0.4);
}

/* ── Count ───────────────────────────────────────────────────────────────── */

#edu-count {
  font-size: 15px;
  font-weight: 700;
  font-family: "Fredoka", "Nunito", sans-serif;
  color: #FF8C42;
  margin-bottom: 16px;
}

/* ── Grid ────────────────────────────────────────────────────────────────── */

#edu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

/* ── Visibility ──────────────────────────────────────────────────────────── */

.hidden { display: none !important; }

/* ── Card ────────────────────────────────────────────────────────────────── */

.edu-card {
  position: relative;
  border-radius: 16px;
  border: 1px solid rgba(0,0,0,0.09);
  background: rgba(255,255,255,0.9);
  padding: 18px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: box-shadow 0.15s, border-color 0.15s, transform 0.15s;
}

.edu-card:hover {
  box-shadow: 0 4px 18px rgba(255,140,66,0.12);
  border-color: rgba(255,140,66,0.3);
  transform: translateY(-2px);
}

/* ── Card top row ────────────────────────────────────────────────────────── */

.edu-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.edu-card-name {
  font-family: "Fredoka", "Nunito", sans-serif;
  font-size: 1.05em;
  font-weight: 700;
  color: #2A2320;
  line-height: 1.2;
}

/* ── Access badge ────────────────────────────────────────────────────────── */

.edu-badge {
  flex-shrink: 0;
  padding: 3px 11px;
  font-size: 0.75em;
  font-weight: 700;
  font-family: "Fredoka", "Nunito", sans-serif;
  border-radius: 999px;
  white-space: nowrap;
}

.edu-badge-free {
  background: rgba(59,191,206,0.12);
  color: #1a9aaa;
  border: 1.5px solid rgba(59,191,206,0.35);
}

.edu-badge-sub {
  background: rgba(249,200,70,0.15);
  color: #a07800;
  border: 1.5px solid rgba(249,200,70,0.4);
}

/* ── Description ─────────────────────────────────────────────────────────── */

.edu-card-desc {
  font-size: 0.88em;
  color: #5A4E47;
  line-height: 1.6;
  flex: 1;
}

/* ── Favourite star ──────────────────────────────────────────────────────── */

.edu-star {
  position: absolute;
  top: 10px;
  right: 12px;
  font-size: 1.15em;
  line-height: 1;
  background: none;
  border: none;
  cursor: pointer;
  color: #ccc;
  padding: 2px 4px;
  transition: color 0.15s, transform 0.12s;
}

.edu-star:hover { color: #ffaa00; transform: scale(1.2); }
.edu-star.is-fav { color: #ffaa00; }

/* ── Footer ──────────────────────────────────────────────────────────────── */

.edu-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 4px;
  flex-wrap: wrap;
}

.edu-card-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  flex-shrink: 0;
}

.edu-card-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.edu-platform {
  font-size: 0.75em;
  font-weight: 700;
  font-family: "Fredoka", "Nunito", sans-serif;
  color: #7A6E68;
  background: rgba(0,0,0,0.05);
  border-radius: 6px;
  padding: 2px 8px;
}

.edu-ages {
  font-size: 0.75em;
  font-weight: 600;
  font-family: "Fredoka", "Nunito", sans-serif;
  color: #7A6E68;
}

.edu-doi {
  font-size: 0.72em;
  font-weight: 700;
  font-family: "Fredoka", "Nunito", sans-serif;
  color: #999;
  text-decoration: none;
  border: 1.5px solid rgba(0,0,0,0.12);
  border-radius: 5px;
  padding: 1px 7px;
  transition: color 0.15s, border-color 0.15s;
}

.edu-doi:hover {
  color: #555;
  border-color: rgba(0,0,0,0.3);
  text-decoration: none;
}

/* ── Docs button ─────────────────────────────────────────────────────────── */

.edu-docs-btn {
  flex-shrink: 0;
  display: inline-block;
  padding: 6px 14px;
  font-size: 0.82em;
  font-weight: 700;
  font-family: "Fredoka", "Nunito", sans-serif;
  color: #1a6e3c;
  border: 2px solid rgba(26,110,60,0.3);
  border-radius: 999px;
  text-decoration: none;
  transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
}

.edu-docs-btn:hover {
  background: #1a6e3c;
  color: #fff;
  border-color: #1a6e3c;
  text-decoration: none;
  transform: translateY(-1px);
}

/* ── Visit button ────────────────────────────────────────────────────────── */

.edu-visit-btn {
  flex-shrink: 0;
  display: inline-block;
  padding: 6px 16px;
  font-size: 0.82em;
  font-weight: 700;
  font-family: "Fredoka", "Nunito", sans-serif;
  color: #FF8C42;
  border: 2px solid rgba(255,140,66,0.35);
  border-radius: 999px;
  text-decoration: none;
  transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
}

.edu-visit-btn:hover {
  background: #FF8C42;
  color: #fff;
  border-color: #FF8C42;
  text-decoration: none;
  transform: translateY(-1px);
}

/* ── Idea / suggestion button ────────────────────────────────────────────── */

.edu-idea-btn {
  font-size: 1em;
  line-height: 1;
  background: none;
  border: 1.5px solid rgba(0,0,0,0.12);
  border-radius: 999px;
  padding: 5px 10px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}

.edu-idea-btn:hover {
  background: rgba(249,200,70,0.18);
  border-color: rgba(249,200,70,0.5);
  transform: scale(1.1);
}

/* ── Suggestion modal ────────────────────────────────────────────────────── */

.edu-suggestion-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.edu-suggestion-box {
  background: #fff;
  border-radius: 18px;
  max-width: 560px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 12px 48px rgba(0,0,0,0.22);
  padding: 24px 28px;
}

.edu-suggestion-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.edu-suggestion-tool {
  font-family: "Fredoka", "Nunito", sans-serif;
  font-weight: 700;
  font-size: 1.1em;
  color: #2A2320;
}

.edu-suggestion-close {
  background: none;
  border: none;
  font-size: 1.1em;
  cursor: pointer;
  color: #999;
  padding: 4px 8px;
  border-radius: 8px;
  transition: background 0.15s, color 0.15s;
}

.edu-suggestion-close:hover { background: rgba(0,0,0,0.07); color: #333; }

.edu-suggestion-content {}

.edu-sug-item {
  padding: 14px 0;
  border-top: 1px solid rgba(0,0,0,0.08);
}

.edu-sug-item:first-child { border-top: none; padding-top: 0; }

.edu-sug-text {
  font-size: 0.92em;
  color: #3A3330;
  line-height: 1.55;
  margin: 0 0 8px;
}

.edu-sug-link {
  display: inline-block;
  font-size: 0.82em;
  color: #FF8C42;
  word-break: break-all;
  text-decoration: underline;
  margin-bottom: 6px;
}

.edu-sug-link:hover { color: #c06010; }

.edu-sug-note {
  font-size: 0.82em;
  color: #7A6E68;
  font-style: italic;
  margin: 6px 0 0;
  line-height: 1.5;
}

/* ── Responsive ──────────────────────────────────────────────────────────── */

@media (max-width: 640px) {
  #edu-grid {
    grid-template-columns: 1fr;
  }
}

</style>
