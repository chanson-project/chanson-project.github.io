// ── Tools that have documentation pages ──────────────────────────────────────

const TOOLS_WITH_DOCS = new Set(["cml-songmaker", "garageband", "lyrics-training", "mauril", "mondly"]);

// ── Filter state ──────────────────────────────────────────────────────────────

let activeAccess = "all";
let activeCat    = "all";

function filteredTools() {
  return EDU_TOOLS.filter(t => {
    const accessOk = activeAccess === "all" || t.access === activeAccess;
    const catOk    = activeCat === "all" || t.category === activeCat;
    return accessOk && catOk;
  });
}

// ── Platform icons ────────────────────────────────────────────────────────────

const PLATFORM_LABELS = { web: "Web", ios: "iOS", android: "Android", mac: "Mac" };

function platformPills(platforms) {
  return platforms.map(p =>
    `<span class="edu-platform">${PLATFORM_LABELS[p] || p}</span>`
  ).join("");
}

// ── Render grid ───────────────────────────────────────────────────────────────

function renderGrid() {
  const lang  = window.LANG || "en";
  const tools = filteredTools();
  const grid  = document.getElementById("edu-grid");
  const count = document.getElementById("edu-count");
  if (!grid) return;

  const one   = t("edu.one_result")  || "1 tool";
  const many  = t("edu.results")     || "tools";
  count.textContent = tools.length === 1 ? one : `${tools.length} ${many}`;

  grid.innerHTML = tools.map(tool => {
    const desc = lang === "fr" ? tool.desc_fr : tool.desc_en;

    const accessLabel = tool.access === "free"
      ? (t("edu.free") || "Free")
      : (tool.price || t("edu.subscription") || "Subscription");

    const accessClass = tool.access === "free" ? "edu-badge-free" : "edu-badge-sub";

    const doiHtml = tool.doi
      ? `<a href="${tool.doi}" target="_blank" rel="noopener noreferrer" class="edu-doi">DOI</a>`
      : "";

    const agesHtml = tool.ages
      ? `<span class="edu-ages">${t("edu.ages") || "Ages"} ${tool.ages}</span>`
      : "";

    return `
      <div class="edu-card" data-access="${tool.access}" data-cat="${tool.category}">
        <div class="edu-card-top">
          <div class="edu-card-name">${tool.name}</div>
          <span class="edu-badge ${accessClass}">${accessLabel}</span>
        </div>
        <div class="edu-card-desc">${desc}</div>
        <div class="edu-card-footer">
          <div class="edu-card-meta">
            ${platformPills(tool.platform)}
            ${agesHtml}
            ${doiHtml}
          </div>
          ${TOOLS_WITH_DOCS.has(tool.id) ? `<a href="/education/docs/#${tool.id}" class="edu-docs-btn" data-i18n="edu.docs">${t("edu.docs") || "Docs"}</a>` : ""}
          <a href="${tool.url}" target="_blank" rel="noopener noreferrer" class="edu-visit-btn"
             data-i18n="edu.visit">${t("edu.visit") || "Visit"} →</a>
        </div>
      </div>`;
  }).join("");
}

// ── Filter button wiring ──────────────────────────────────────────────────────

function initFilters() {
  document.querySelectorAll(".edu-tab").forEach(btn => {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".edu-tab").forEach(b => b.classList.remove("active"));
      this.classList.add("active");
      activeAccess = this.dataset.filter;
      renderGrid();
    });
  });

  document.querySelectorAll(".edu-cat").forEach(btn => {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".edu-cat").forEach(b => b.classList.remove("active"));
      this.classList.add("active");
      activeCat = this.dataset.cat;
      renderGrid();
    });
  });
}

document.addEventListener("DOMContentLoaded", function () {
  initFilters();
  renderGrid();
});
