<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Orange circle background -->
  <circle cx="32" cy="32" r="31" fill="#FF8C42"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#F9C846" stroke-width="2" opacity="0.6"/>

  <!-- Stylized lark/bird (Alouette) in white -->
  <!-- Body -->
  <ellipse cx="30" cy="36" rx="12" ry="8" fill="white" transform="rotate(-15 30 36)"/>
  <!-- Head -->
  <circle cx="43" cy="28" r="8" fill="white"/>
  <!-- Beak -->
  <path d="M50 27 L56 26 L51 30 Z" fill="#F9C846"/>
  <!-- Eye -->
  <circle cx="45" cy="27" r="1.8" fill="#FF8C42"/>
  <circle cx="45.6" cy="26.4" r="0.6" fill="white"/>
  <!-- Wing detail -->
  <path d="M20 33 Q25 25 36 30" fill="none" stroke="#FF8C42" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Tail feathers -->
  <path d="M18 37 Q14 32 10 35 Q14 40 18 37Z" fill="white"/>
  <path d="M19 40 Q15 38 12 42 Q16 44 19 40Z" fill="white" opacity="0.8"/>
  <!-- Wing highlight -->
  <path d="M36 30 Q40 24 48 26" fill="none" stroke="rgba(249,200,70,0.7)" stroke-width="2" stroke-linecap="round"/>

  <!-- Small music note top-right -->
  <g transform="translate(46,10) rotate(15)" opacity="0.85">
    <ellipse cx="0" cy="7" rx="4" ry="3" fill="#F9C846" transform="rotate(-20 0 7)"/>
    <rect x="-0.5" y="-6" width="2" height="13" rx="1" fill="#F9C846"/>
    <path d="M1.5 -6 Q9 -9 9 -3 Q9 1 3 2" fill="#F9C846"/>
  </g>
</svg>
