function buildLessonPlansGrid() {
  const grid = document.getElementById("lp-grid");
  if (!grid) return;

  grid.innerHTML = LESSON_PLANS.map(plan => {
    const stepsHtml = plan.steps.map((s, i) =>
      `<li><span class="lp-step-num">${i + 1}</span>${s}</li>`
    ).join("");

    const materialsHtml = plan.materials.map(m => `<li>${m}</li>`).join("");

    const objectivesHtml = plan.objectives.map(o => `<li>${o}</li>`).join("");

    const docsHtml = plan.docs.length
      ? `<div class="lp-docs"><span class="lp-docs-label">Documentation:</span>` +
        plan.docs.map(d => `<a href="${d.url}" target="_blank" rel="noopener noreferrer" class="lp-doc-link">⬇ ${d.label}</a>`).join("") +
        `</div>`
      : "";

    const eduLink = plan.toolId
      ? `<a href="/education/#${plan.toolId}" class="lp-tool-link">View tool →</a>`
      : `<a href="${plan.toolUrl}" target="_blank" rel="noopener noreferrer" class="lp-tool-link">Visit tool →</a>`;

    return `
      <div class="lp-card" id="lp-${plan.id}">
        <div class="lp-card-header" onclick="toggleLesson('${plan.id}')">
          <div class="lp-card-left">
            <div class="lp-card-tool">${plan.tool}</div>
            <div class="lp-card-song">🎵 <em>${plan.song}</em></div>
          </div>
          <div class="lp-card-right">
            <span class="lp-age-badge">Ages ${plan.ages}</span>
            <span class="lp-grade-badge">${plan.grade}</span>
            <span class="lp-chevron">▼</span>
          </div>
        </div>
        <div class="lp-detail">
          <div class="lp-detail-inner">
            <div class="lp-detail-body">
              <div class="lp-section">
                <div class="lp-section-label">Learning Objectives</div>
                <ul class="lp-objectives">${objectivesHtml}</ul>
              </div>
              <div class="lp-section">
                <div class="lp-section-label">Materials</div>
                <ul class="lp-materials">${materialsHtml}</ul>
              </div>
              <div class="lp-section">
                <div class="lp-section-label">Steps</div>
                <ol class="lp-steps">${stepsHtml}</ol>
              </div>
              ${docsHtml}
              <div class="lp-footer">${eduLink}</div>
            </div>
          </div>
        </div>
      </div>`;
  }).join("");
}

function toggleLesson(id) {
  const card = document.getElementById("lp-" + id);
  if (!card) return;
  card.classList.toggle("is-open");
}

document.addEventListener("DOMContentLoaded", buildLessonPlansGrid);

</script>
