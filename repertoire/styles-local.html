<style>

.wrapper {
  max-width: 1000px;
}

/* ── YouTube icon ───────────────────────────────────────────────────────── */

.yt-link {
  display: inline-flex;
  align-items: center;
  vertical-align: middle;
  margin-left: 6px;
  opacity: 0.8;
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.yt-link:hover {
  opacity: 1;
  transform: scale(1.15);
}
.yt-icon-svg {
  display: block;
}

/* ── Table header ───────────────────────────────────────────────────────── */

table.general thead th {
  position: sticky;
  top: var(--nav-height, 76px);
  z-index: 1;
  background: linear-gradient(135deg, #FF8C42, #ffaa5e);
  color: #fff;
  border-bottom: none;
  font-family: "Fredoka", "Nunito", sans-serif;
  font-size: 14px;
  font-weight: 700;
}

table.general thead th.sortable {
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}

table.general thead th.sortable:hover {
  background: linear-gradient(135deg, #e87a30, #ff9f50);
}

/* Truncate long text in title column */
table.general td:nth-child(2) {
  max-width: 220px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Key and Time-signature columns: no wrap */
table.general td.amd-key,
table.general td.amt-sig {
  white-space: nowrap;
}

/* ── Search interface ───────────────────────────────────────────────────── */

#search-interface {
  margin-bottom: 32px;
}

  border-radius: 18px;
  border: 2.5px solid rgba(0,0,0,0.10);
  background-color: rgba(255,255,255,0.95);

  background-position: 14px center;
  background-repeat: no-repeat;
  background-size: 20px;
  box-shadow: 0 3px 0 rgba(255,140,66,0.18), 0 4px 16px rgba(0,0,0,0.05);
  transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.12s ease;
}

#melodic-input:focus {
  outline: none;
  border-color: #FF8C42;
